; =============================================================================
; VFS Slot Checker — REFERENCE template (COMMITTED to GitHub, no real secrets).
;
; This file documents every setting with safe defaults and BLANK secrets. It is
; NOT the file you edit for a live deployment — the real values (incl. tokens,
; keys, and any overrides) live in config/config.local.ini (gitignored), which
; is read LAST and overrides everything here. Every *.ini in this folder loads.
;
; New machine: copy this file's shape into config/config.local.ini and fill in
; the real values there (or use config_editor.py, which edits config.local.ini).
;
; Sections, grouped below:
;   Scheduling & runtime  -> [schedule] [browser] [proxy]
;   Account safety        -> [account_safety] [turnstile] [waitlist]
;   Timing & retries      -> [timeouts] [retry]
;   Notifications         -> [telegram]
;   Integrations          -> [otp] [openai]
;   Diagnostics           -> [logging]
;   Bandwidth             -> [bandwidth]
; =============================================================================


; ----------------------------------------------------------------------------
; Scheduling & runtime
; ----------------------------------------------------------------------------

[schedule]
; How many times per hour the scheduler fires, evenly spaced (3 -> :00/:20/:40,
; 2 -> :00/:30). This ONE number drives both the Windows Task Scheduler triggers
; (rebuild with setup_task.ps1) AND the account rotation, which spreads accounts
; across every run of the day so each account is used as rarely as possible.
runs_per_hour = 2
; Active window on the local 24h clock: runs from start_hour up to (not incl.)
; end_hour. Outside it, nothing fires. 9->19 = 09:00 .. 18:xx, ten hours.
start_hour = 9
end_hour = 19

[browser]
; Playwright engine + headless toggle for the bot's OWN browser (the prod path).
; When the supervisor launches Chrome and injects a cdp_url at runtime, the bot
; attaches to that window instead and type/headless are ignored.
type = chromium
headless = True
; Per-step debug screenshots. false = only the single final screenshot is saved.
screenshots_enabled = false

[proxy]
; Master switch for IP routing.
;   true  = route each run through proxy-seller residential IPs (config/proxylist.txt),
;           one dedicated UAE IP per account, used across all its routes.
;   false = use THIS PC's own IP directly (no proxy).
; Override for a single run with the supervisor's --proxy / --local flag.
; (Reference default; the live value is set in config.local.ini.)
enabled = false
; Region gate: before a proxy is used, its exit is pinged and its country checked
; ONCE. An exit that is dead, or NOT in this country, is skipped and the next
; pool IP is tried. This kills geo-blocks (403203) and mid-run WinError 10054 at
; the source. ISO 3166 alpha-2 (AE = UAE, the only region VFS accepts here).
; Leave BLANK to disable the region check (still skips dead exits).
require_country = AE


; ----------------------------------------------------------------------------
; Account safety
; ----------------------------------------------------------------------------

[account_safety]
; Circuit breaker that protects accounts from being hammered into a VFS block/
; ban. An account in cooldown is skipped by credential selection until it clears.
; A hard block (429001 restricted / 429202 locked) benches the account for
; hard_cooldown_hours. Any run that stays stuck (Turnstile/Sign In/dashboard/OTP
; failures) counts a strike; after fail_threshold consecutive strikes the account
; is benched for soft_cooldown_hours. A success clears the account's strikes.
hard_cooldown_hours = 12
soft_cooldown_hours = 2
fail_threshold = 3
; In-run browser relaunches on failure. Also caps how many FRESH IPs a route can
; rotate through (each rotation consumes one relaunch), so keep it == [retry]
; max_ip_tries. A stuck account fails after 1 route run regardless (one strike).
max_attempts = 2

[turnstile]
; Local headed debugging only: seconds to wait while YOU click the Cloudflare
; "Verify you are human" checkbox by hand (no auto-solve/refresh). Keep 0 in prod.
manual_wait_seconds = 0

[waitlist]
; --- Detection & notification (always on, read-only) -------------------------
; When a route has no bookable slot but VFS offers a waitlist, a Telegram notice
; is sent (success chat). To avoid spamming while a country sits on the waitlist
; all day, further notices for the SAME destination country are suppressed for
; this many hours after one is sent. State: waitlist_cooldown.json (gitignored).
; 0 disables the cooldown (send every run).
cooldown_hours = 2

; --- Registration (MUTATES the VFS account) ----------------------------------
; Actually signing up for the waitlist: ticks the checkbox, fills the applicant
; form and submits. Run ON DEMAND only (python -m src.waitlist run ...) — it is
; deliberately NOT wired into the hourly supervisor.
;
; FOUR independent opt-ins are required before anything is submitted:
;   1. register_enabled = true                    (this switch)
;   2. config/waitlist/<ROUTE>.json exists, "enabled": true
;   3. the client file has "enabled": true
;   4. the exact combination is named in that client's "combos" list
; No single mistake can therefore cause an unintended registration.
;
; Clients live in config/registrants/<name>.json — one file per client, holding
; their route, their combinations and their form data. Adding a client is that
; one file; there is no second folder to keep in sync.
;
; register_enabled - MASTER kill switch. false = detect + notify only, i.e.
;                    exactly the behaviour before registration existed.
; dry_run          - walk the whole flow (tick, fill, screenshot) but STOP before
;                    the committing submit. Keep true until a dry run has been
;                    verified on every route you intend to use.
; max_per_run      - registrations one invocation may commit.
; max_per_day      - registrations per calendar day, across all runs (counted
;                    from state/waitlist_journal.jsonl).
;
; Override for a single invocation without editing this file, e.g.
;   VFSCFG_WAITLIST__DRY_RUN=false python -m src.waitlist run --route AE-CHE ...
; auto_trigger_enabled - let the hourly slot checker FIRE a waitlist run the
;                        moment it finds an open waitlist, instead of you
;                        running it by hand. OFF by default: this is the switch
;                        that lets the system register with nobody watching.
; auto_trigger_dry_run - when auto-triggering, walk the whole flow but stop
;                        before the committing click. TRUE by default. Turn it
;                        off only after watching real dry runs: the auto-trigger
;                        picks its own clients, so a wrong combo mapping would
;                        otherwise register the wrong person.
; Both are gated behind register_enabled as well — all three must be right.
auto_trigger_enabled = false
auto_trigger_dry_run = true

register_enabled = false
dry_run = true
max_per_run = 3
max_per_day = 20
; Telegram for REGISTRATION outcomes. OFF by default: this bot runs on demand
; with you watching the terminal, which already prints every outcome — so a
; message would be noise in a chat whose value is that it only pings when the
; hourly slot checker finds something. (The read-only "waitlist available"
; notice sent by the slot checker is a different thing and is unaffected.)
telegram_enabled = false

; --- Which VFS account waitlist entries are created under --------------------
; Waitlist accounts are a SEPARATE POOL from the slot-check accounts in
; config/credentials.local.ini. Nothing is ever read from that file — not the
; email, not the password. Two reasons: a waitlist entry BELONGS TO the account
; that created it (register Ahmed under acc1 and only acc1 can see, cancel or
; verify it), and the hourly rotation would scatter entries across logins and
; lose them.
;
; Resolution order, first hit wins — each needs BOTH the email and its password:
;   1. --email + --password on the command line
;   2. "account" + "account_password" in config/registrants/<client>.json
;   3. [waitlist] account + account_password below   (default for all clients)
; If none is set the run STOPS with an error rather than borrowing a slot-check
; account.
;
; DO NOT put a real password here — set it in config/config.local.ini.
account =
account_password =

; --- Which exit IP a waitlist run uses ---------------------------------------
; The pool is config/proxylist.txt, same file the slot checker uses. What
; differs is how an ACCOUNT is pinned to an entry in it.
;
; proxy_pool pins slot-check accounts by their position in
; config/credentials.local.ini — which waitlist accounts are deliberately not in.
; That lookup would fall through to a hash of the address, giving an effectively
; arbitrary IP that shifts as the pool changes. Harmless with one proxy, wrong
; with two: a waitlist entry belongs to the account that made it, so the exit IP
; should be stable.
;
; Resolution order, first hit wins:
;   1. --proxy-url on the command line   ('' forces the local IP)
;   2. "proxy" in config/registrants/<client>.json   (pins one client)
;   3. [waitlist] proxy below                        (one IP for all waitlisting)
;   4. by position in [waitlist] accounts below, else a stable hash
;
; proxy    - a full proxy URL, e.g. http://user:pass@host:port. Leave blank to
;            pick from config/proxylist.txt.
; accounts - comma-separated waitlist account emails. ORDER DECIDES which pool
;            entry each one gets (1st account -> 1st proxy, and so on), so you
;            control the mapping just by reordering. Leave blank for hashing.
proxy =
accounts =

; One account may serve several clients. VFS's real limit is undocumented, so
; both knobs are configurable rather than assumed:
;
; max_clients_per_account      - distinct clients allowed per account.
;                                0 = unlimited (the default).
; one_client_per_account_combo - whether ONE account may hold TWO waitlist
;                                entries for the SAME combination.
;                                false (default) = warn in the log and proceed.
;                                CONFIRMED: VFS DOES allow this, so false is
;                                correct — leave it unless that changes.
max_clients_per_account = 0
one_client_per_account_combo = false

; --- Client identity documents (passport bio pages) --------------------------
; Some portals (Italy) do not ask for typed details at all — you upload the
; passport bio page and VFS reads the fields out of it. A scan is a bigger
; liability than the passport NUMBER already in a client file: it carries the
; photo, the MRZ and the signature.
;
; Two rules follow, and the second matters more than any encryption would:
;
;   1. Documents live OUTSIDE this repo. config/registrants/ is inside the git
;      working tree and its ignore rules cover *.json only — a scan dropped
;      there would be committed, and a passport in git history cannot be
;      recalled. Leave documents_root blank for a per-user location:
;         Windows  %LOCALAPPDATA%\vfs-bot\documents
;         Linux    /var/lib/vfs-bot/documents (else ~/.local/share/vfs-bot/...)
;
;   2. Documents are DELETED as soon as a registration is confirmed. The
;      document has then served its only purpose and keeping it is pure
;      liability. document_retention_days is the backstop for anything a
;      crashed run left behind; the sweep runs at the start of every
;      invocation, so it needs no scheduling of its own. 0 disables it.
;
; A client file points at its document either with an explicit path, or with the
; value "managed" to use the store (python -m src.waitlist documents add ...).
;
; NOTE: whole-disk encryption (BitLocker / encrypted EBS) is what protects these
; at rest. Application-level encryption is deliberately NOT used — an unattended
; bot must decrypt without a human, so the key would sit on the same machine as
; the file and buy nothing against the realistic threats.
documents_root =
document_retention_days = 30


; ----------------------------------------------------------------------------
; Timing & retries  (defaults tuned for VFS — change only if you know why)
; ----------------------------------------------------------------------------

[timeouts]
; Page-level waits, in milliseconds.
; page_load_ms   - navigating to the login URL
; login_wait_ms  - waiting for the login form to appear (cold first load). Kept
;                  SHORT (15s) so a stuck/blank load fails fast and the supervisor
;                  retries with a fresh browser instead of hanging ~2min. A block/
;                  'Session Expired' page is still caught in ~1.5s regardless.
; relogin_wait_ms- waiting for the form to REappear after a reload (Turnstile /
;                  session refresh); a stuck reload bails instead of hanging.
; dashboard_ms   - await dashboard while handling captcha
; dashboard_frozen_ms - B: if the post-login loading spinner stays stuck this long
;                  with no dashboard ("solved but frozen"), bail early instead of
;                  grinding the full dashboard_ms so a fresh IP/browser can retry.
; signin_settle_ms - poll ceiling for learning what the Sign In click did (403
;                  captured / URL moved on / OTP field rendered / captcha popped).
;                  Replaces a flat 2s sleep that a proxied login-403 regularly
;                  arrived after, leaving the run to blame the next timeout.
; login_bounce_grace_ms - how long the login form may still be on screen after
;                  Sign In before it counts as a BOUNCE (VFS refused the login)
;                  rather than a submission still in flight. Too low and a slow
;                  submit looks like a bounce; too high and we wait for nothing.
; slot_read_ms   - read the "Earliest available slot" banner
page_load_ms = 60000
login_wait_ms = 15000
relogin_wait_ms = 45000
dashboard_ms = 90000
dashboard_frozen_ms = 30000
signin_settle_ms = 8000
login_bounce_grace_ms = 6000
slot_read_ms = 12000

[retry]
; Attempt/backoff behaviour. (The in-run relaunch count is [account_safety]
; max_attempts — its historical home — not repeated here.)
; backoff_seconds             - pause between relaunch attempts
; max_ip_tries                - different IPs to try on a 403201 IP block
; turnstile_refresh_attempts  - page reloads to unstick a stuck Turnstile
; turnstile_signin_retries    - same-IP reload+re-solve on a rejected (non-403201)
;                               login 403 (stale Turnstile token) before rotating IP
; session_refresh_attempts    - recovery passes on a 'Session Expired or Invalid'
;                               page before failing fast (retryable). Each pass
;                               CHANGES something rather than re-requesting the
;                               same URL: pass 1 clears VFS's session cookies,
;                               pass 2 also drops cf_clearance (it is bound to the
;                               IP that earned it, and a stale one causes this).
; dashboard_captcha_cycles    - times to re-solve the post-Sign-In 'Verify Captcha'
;                               dialog before declaring a Cloudflare re-challenge
;                               loop and abandoning (avoids grinding MB for 90s)
; cdp_port                    - Chrome remote-debugging port
backoff_seconds = 15
; More fresh IPs per failing route (pair with [account_safety] max_attempts).
; Churn-safe: a failed login is never recorded as "account logged in from that IP".
max_ip_tries = 2
; A: retry the SAME IP fewer times, then rotate. A Cloudflare-flagged IP won't
; un-flag on reload, so 1 same-IP reload (not 2) avoids re-downloading the whole
; challenge before rotating to a fresh IP.
turnstile_refresh_attempts = 1
; 0 = don't re-login on the same IP after a rejected post-Sign-In token — each
; same-IP re-login escalates Cloudflare's challenge on that IP. Rotate instead.
turnstile_signin_retries = 0
session_refresh_attempts = 2
dashboard_captcha_cycles = 3
; E: hard cap on page loads (goto/reload) within one browser attempt, so a
; login/Turnstile loop can't spiral into a dozen metered page fetches.
max_page_loads_per_attempt = 6
cdp_port = 9222


; ----------------------------------------------------------------------------
; Notifications
; ----------------------------------------------------------------------------

[telegram]
; Two channels: slot reports -> success chat (bot_token + TELEGRAM_chat_id);
; failure/error/run-summary -> summary chat (TELEGRAM_SUMMARY_*).
; DO NOT put real tokens/ids here — set them in config/config.local.ini.
bot_token =
TELEGRAM_chat_id =
TELEGRAM_SUMMARY_BOT_TOKEN =
TELEGRAM_SUMMARY_CHAT_ID =

[tv_announce]
; Also push slot finds to the web app's TV screen (POST, X-API-Key auth).
; Sent alongside the Telegram slot report, only for the destinations below.
; enabled      - master switch.
; destinations - comma-separated route destination codes to announce.
; api_key      - DO NOT put the real key here — set it in config/config.local.ini.
; priority     - announcement order. ONE announcement is sent per open
;                combination, and the TV rotates them in arrival order, so the
;                category you most want read out goes first here. Matched
;                case-insensitively inside a combination's category or its
;                route-file "tv_title", so 'Tourist' catches both 'Short Stay -
;                Tourist' and France's relabelled any-purpose row. France has no
;                tourist category — 'Short Stay (any purpose)' is its tourist
;                route — which is why that leads the list. Anything unlisted is
;                announced after these, in the order the route checked it.
;                What the TV CALLS a combination is set per combination, with
;                "tv_title" / "tv_category" in config/routes/<ROUTE>.json.
; title_format - the headline. Placeholders: {country}, {visa_type}, {city}.
;                Two announcements must never share a title or the server drops
;                the second, so a format without {visa_type} is a bad idea; a
;                format naming anything else falls back to the built-in wording
;                and says so in the log.
; The server suppresses a repeated title for 5 minutes ("duplicate": true), so
; each announcement's title carries its own category.
enabled = true
url = https://www.travnooker.com/api/tv/ingest/announce
api_key =
destinations = FRA, ITA
priority = Short Stay (any purpose), Tourist, Tourism
title_format = {country} {visa_type} Available
kind = urgent
source = vfs-slot-checker
timeout_seconds = 10


[tv_board]
; Push the whole slot board to the web app after every run, so its own page can
; render it (see web/ for the React component). Same host and same X-API-Key as
; [tv_announce]; leave api_key blank here and it uses that one.
;
; PUSH, not pull, on purpose: this PC only runs inside the [schedule] window, so
; a page that asked it for the board would fail every night. A pushed snapshot
; is always there, and says its own age on every card.
;
; The receiver must NOT deduplicate. Unlike an announcement, every board POST is
; a fresh snapshot and should replace the stored one.
;
; enabled - master switch. Off until the web app has somewhere to receive it.
; days    - window the board covers. Matches the dashboard's default.
enabled = false
url = https://www.travnooker.com/api/tv/ingest/board
api_key =
days = 7
timeout_seconds = 15


; ----------------------------------------------------------------------------
; Integrations
; ----------------------------------------------------------------------------

[otp]
; OTP-by-email verification, used only on routes flagged "otp": true in their
; config/routes/<ROUTE>.json. The mailbox login reuses the active [credN]
; email/password (accounts rotate hourly).
; imap_host + search_text are deployment-specific -> set them in
; config/config.local.ini (gitignored); the blanks here are overridden there.
imap_host =
imap_port = 993
search_text =
timeout_seconds = 120
poll_seconds = 5
otp_length = 6
; How many times to re-read the OTP image with OpenAI before giving up (and
; only THEN relaunching the browser). Recovers a transient OCR misread in-place.
read_attempts = 3
; How many times to SUBMIT an OTP to VFS. On each "Please enter a valid one time
; password" rejection the image is re-read for a DIFFERENT code and re-submitted.
; Keep small — each wrong submit counts toward VFS account lockout.
submit_attempts = 3

[openai]
; Used to read the OTP out of the email's image attachment.
; DO NOT put the real key here — set it in config/config.local.ini (gitignored).
api_key =
model = gpt-4o-mini
; Seconds to wait for one OTP-image read before giving up. Kept SHORT so a hung
; request fails fast and the read_attempts loop re-reads in-session, rather than
; a long hang forcing a full browser relaunch (~8-10 MB).
request_timeout_seconds = 18


; ----------------------------------------------------------------------------
; Diagnostics
; ----------------------------------------------------------------------------

[logging]
level = INFO
browser_activity = false


; ----------------------------------------------------------------------------
; Bandwidth  (metered proxy — every byte the browser fetches is billed)
; ----------------------------------------------------------------------------

[bandwidth]
; log_usage           - log data usage after each route (PASSIVE — only measures):
;                       "Browser traffic this route" (ALWAYS, proxy or local IP) and
;                       "Proxy traffic this route" (billed bytes, proxy runs only).
; mute_chrome         - disable Chrome's background/phone-home traffic
;                       (SafeBrowsing lists, component/field-trial updates, telemetry).
; block_resource_types- Playwright resource types to abort, comma-separated.
;                       Empty = block nothing. LEAVE IT EMPTY.
;
; NOTE: this is the ONE setting that installs in-browser request interception,
; and interception makes Chromium bypass its HTTP disk cache for the whole run.
; That is not a theoretical cost — it is what tripled the proxy bill on
; 2026-08-17 (2.23 -> 6.90 MB per route-attempt, ~1.5 GB/day) while saving about
; 12 MB/day. Blocking a few images cannot pay back the entire persist_cache.
; It ALSO risks the Turnstile solve (shifts the coordinate-clicked checkbox and
; the odd load pattern makes Cloudflare suspicious). If you ever turn it on, the
; bot logs a WARNING and you must compare 'Proxy traffic this route' against a
; run with it off before keeping it.
;
; block_hosts        - third-party analytics/marketing/telemetry HOSTS to refuse
;                      (Google Tag Manager, Facebook pixel, Dynatrace, ...).
;                      Enforced in the PROXY FORWARDER, not the browser: the
;                      request is refused before the metered upstream is dialled,
;                      so those bytes are never billed AND no HTTP cache is lost.
;                      Safe for Turnstile (none are the Cloudflare challenge or
;                      the VFS app). Matched by exact host or dotted suffix.
;                      NEVER add challenges.cloudflare.com or *.vfsglobal.com.
;                      Applies to proxied runs only — a direct connection has no
;                      metered upstream to protect.
;                      Leave blank to disable host blocking; the built-in default
;                      list (see src/settings.py Bandwidth.block_hosts) is used when
;                      this key is omitted entirely.
; daily_cap_mb    - HARD ceiling on billed proxy traffic per calendar day. When
;                   today's total reaches it the remaining routes are PAUSED
;                   (not failed — no account is struck) and later runs today
;                   exit immediately; everything resumes by itself at midnight.
;                   Checked BETWEEN routes, never mid-route, so the route in
;                   flight always finishes and the day can end slightly over.
;                   Counts PROXY bytes only (what the provider bills); a direct
;                   local-IP run costs nothing and isn't counted. 0 = no cap.
; warn_at_percent - send ONE Telegram warning per day the first time usage
;                   crosses this share of the cap, so a regression shows up at
;                   lunchtime instead of on the invoice. 0 = no warning.
;                   Today's counter lives in bandwidth_budget.json; inspect or
;                   clear it with:  python -m src.utils.bandwidth_budget [reset]
log_usage = true
daily_cap_mb = 800
warn_at_percent = 60
mute_chrome = true
block_resource_types =
; persist_cache - reuse a PER-ACCOUNT browser cache across runs so static JS/CSS/
;                 fonts (and that account's cf_clearance) come from disk instead of
;                 the metered proxy. Biggest safe saving. VERIFY Turnstile with a
;                 live run before enabling on the scheduler; set false to roll back.
; cache_size_mb - disk-cache cap per account profile (total disk ~= accounts x this).
persist_cache = true
cache_size_mb = 128

[webhook]
; Outbound callbacks to your web app: the bot POSTs what happened (a waitlist
; opened, a registration succeeded/failed, a real slot appeared) so the app can
; tell the client without polling. Telegram keeps working alongside this — it is
; your out-of-band channel for when the app itself is down.
;
; enabled  - MASTER switch. false = never post anything outbound.
; url      - your endpoint, e.g. https://your-app.example.com/webhooks/vfs
; secret   - HMAC-SHA256 signing key. NOT the same as the API's
;            VFSAPI_SECRET_TOKEN: that one authenticates INBOUND requests to
;            this machine, this one proves OUTBOUND requests came from the bot.
;            Generate with:  python -c "import secrets; print(secrets.token_hex(32))"
;            Put the real value in config.local.ini, never here.
;
; Your app MUST verify the X-VFS-Signature header (sha256=<hex> over the raw
; request body) and reject anything that does not match — otherwise anyone who
; learns the URL can post a fake "registration confirmed".
;
; Undeliverable events are retried with backoff and then appended to
; state/webhook_deadletter.jsonl rather than dropped.
enabled = false
url =
secret =
timeout_seconds = 10.0

[slots]
; Slot HISTORY — the permanent record behind the agent dashboard.
;
; Every combination the bot checks is written to a SQLite database as it is
; read: the outcome (slot / waitlist / none / error), every date VFS quoted per
; party size, and the run it happened in. The dashboard (and, later, the
; prediction models) read that database; nothing here changes what the bot
; checks or reports.
;
; enabled      - false stops all recording. The logs still hold everything, and
;                scripts/seed_from_logs.py can import them later, so turning
;                this off loses nothing permanently.
; db_path      - where the database lives. Override for one run with the
;                VFS_SLOTS_DB environment variable.
; dashboard_path - where build_dashboard.py writes the HTML page.
; auto_build_dashboard - rebuild that page at the end of every run, so the
;                page an agent opens is never more than one cycle stale.
; closed_days  - weekdays the bot does not run, comma separated (monday..sunday).
;                These are NOT treated as missing evidence: nothing opens on them,
;                so coverage removes them from both the watched and the unwatched
;                side. Leaving a running day listed here would hide a real blind
;                spot; leaving a non-running day out makes every coverage figure
;                look worse than it is. Blank means the bot runs every day.
enabled = true
closed_days = sunday
db_path = state/slots.db
dashboard_path = reports/slot_dashboard.html
auto_build_dashboard = true
